version: '3.8'

services:
  backend:
    build:
      context: ./Backend
    container_name: sanketra_backend
    ports:
      - "3000:3000"
    env_file:
      - ./Backend/.env
    environment:
      - PORT=3000
    volumes:
      - ./Backend:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
    container_name: sanketra_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./Frontend:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped

  ai_service:
    build:
      context: ./AIService
    container_name: sanketra_ai
    ports:
      - "8000:8000"
    volumes:
      - ./AIService:/app
    restart: unless-stopped
