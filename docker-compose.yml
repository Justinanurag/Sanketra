version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: sanketra_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sanketra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
    container_name: sanketra_backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/sanketra
      - PORT=3000
    depends_on:
      - db
    volumes:
      - ./Backend:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
    container_name: sanketra_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./Frontend:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped

  ai_service:
    build:
      context: ./AIService
    container_name: sanketra_ai
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/sanketra
    depends_on:
      - db
    volumes:
      - ./AIService:/app
    restart: unless-stopped

volumes:
  pgdata:
